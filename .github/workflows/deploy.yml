name: "Stage 1 – Baseline Playback"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-with-mocks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # - name: Upload mock YAML to WireMock Cloud
      #   run: npm run upload-contract

      - name: Install WireMock CLI
        run: npx @wiremock/cli --version

      - name: Authenticate with WireMock Cloud
        env:
          WIREMOCK_API_TOKEN: ${{ secrets.WIREMOCK_API_TOKEN }}
        run: npx @wiremock/cli config set api_token "$WIREMOCK_API_TOKEN"

      - name: Pull mock API from WireMock Cloud
        run: npx @wiremock/cli pull mock-api k59q9 --into example-mock-api

      - name: Start WireMock local playback
        run: |
          npx @wiremock/cli run &
          echo "Waiting for WireMock readiness..."
          timeout 60 bash -c 'until curl --silent --fail http://localhost:8081/__admin/mappings > /dev/null; do sleep 2; done'
          echo "✓ WireMock is fully ready"

      - name: Fetch mappings
        run: |
          echo "Fetching mappings..."
          curl --fail --silent --show-error http://localhost:8081/__admin/mappings -o mappings.json
          echo "✓ Mappings fetched"

      - name: Extract endpoints
        run: |
          echo "Extracting endpoints..."
          ENDPOINTS=$(grep -o '\"url\"[ ]*:[ ]*\"[^\"]*\"' mappings.json | sed 's/.*\"url\"[ ]*:[ ]*\"\\([^\"]*\\)\".*/\\1/' | sort -u)
          echo "Found endpoints:"
          echo "$ENDPOINTS"
          echo "$ENDPOINTS" > endpoints.txt

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          FAIL=0
          while read -r endpoint; do
            if [ -n "$endpoint" ]; then
              echo "Testing $endpoint"
              if ! curl --fail --silent --show-error "http://localhost:8081$endpoint" > /dev/null; then
                echo "❌ Failed: $endpoint"
                FAIL=1
              else
                echo "✅ Passed: $endpoint"
              fi
            fi
          done < endpoints.txt
          if [ $FAIL -ne 0 ]; then
            echo "❌ Some endpoints failed"
            exit 1
          fi
          echo "✓ All endpoints passed"
