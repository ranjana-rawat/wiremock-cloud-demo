name: "Stage 1 – Baseline Playback"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-with-mocks:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ── Checkout repo ───────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Setup Node (only for CLI usage) ────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── Install WireMock CLI ───────────────────────
      - name: Install WireMock CLI
        run: npm install -g @wiremock/cli

      # ── Authenticate with WireMock Cloud ──────────
      - name: Authenticate with WireMock Cloud
        run: wiremock config set api_token "${{ secrets.WIREMOCK_API_TOKEN }}"

      # ── Pull mock API ─────────────────────────────
      - name: Pull mock APIs from WireMock Cloud
        run: |
          wiremock pull mock-api k59q9 --into example-mock-api

      # ── Start WireMock locally ────────────────────
      - name: Start WireMock local playback
        run: |
          wiremock run > wiremock.log 2>&1 &
          echo "Waiting for WireMock to be ready..."

          timeout 60 bash -c 'until curl -s http://localhost:8081 > /dev/null; do sleep 2; done'

          echo "✓ Mock server ready on :8081"

      # ── Verify mock is working ────────────────────
      - name: Verify mocks are running locally
        env:
          EXAMPLE_API_BASE_URL: http://localhost:8081
        run: |
          echo "EXAMPLE_API_BASE_URL = $EXAMPLE_API_BASE_URL"
          echo ""
          echo "--- Probing mock API ---"

          curl --fail --silent --show-error \
          "$EXAMPLE_API_BASE_URL/v1/current.json?key=probe&q=51.5074,-0.1278&aqi=no" \
          | python3 -c "import sys,json; d=json.load(sys.stdin); print('✓ location:', d['location']['name'])"

      # ── (Optional) Run tests ──────────────────────
      # Uncomment ONLY if you actually have tests + package.json
      #
      # - name: Install dependencies
      #   run: npm install
      #
      # - name: Run tests against WireMock
      #   env:
      #     EXAMPLE_API_BASE_URL: http://localhost:8081
      #     EXAMPLE_API_KEY: mock-key
      #   run: npm test

      # ── Debug logs (only on failure) ──────────────
      - name: Print WireMock logs (if failed)
        if: failure()
        run: cat wiremock.log