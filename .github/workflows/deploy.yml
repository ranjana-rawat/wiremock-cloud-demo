name: "Stage 1 – Baseline Playback"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-with-mocks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Upload mock YAML to WireMock Cloud
        run: npm run upload-contract

      - name: Install WireMock CLI + jq
        run: |
          npm install --global @wiremock/cli
          sudo apt-get update
          sudo apt-get install -y jq netcat

      - name: Authenticate with WireMock Cloud
        run: wiremock config set api_token "${{ secrets.WIREMOCK_API_TOKEN }}"

      - name: Pull mock API from WireMock Cloud
        run: wiremock pull mock-api k59q9 --into example-mock-api

      - name: Start WireMock local playback
        run: |
          wiremock run &
          echo "Waiting for WireMock on port 8081..."
          timeout 60 bash -c 'until nc -z localhost 8081; do sleep 1; done'
          echo "✓ WireMock server started on http://localhost:8081"

      - name: Fetch mappings with retry
        env:
          BASE_URL: http://localhost:8081
        run: |
          set -euo pipefail
          echo "Fetching mappings from WireMock..."

          for i in {1..10}; do
            if curl --fail --silent --show-error "$BASE_URL/__admin/mappings" -o mappings.json; then
              echo "✓ Mappings fetched successfully"
              break
            fi

            echo "Retrying ($i)..."
            sleep 2
          done

          if [[ ! -s mappings.json ]]; then
            echo "ERROR: mappings.json is empty or missing"
            cat mappings.json || true
            exit 1
          fi

          echo "Validating JSON..."
          jq . mappings.json > /dev/null

      - name: Extract endpoints
        run: |
          echo "Extracting endpoints..."
          ENDPOINTS=$(jq -r '.mappings[].request.url' mappings.json | sort -u)

          echo "Found endpoints:"
          echo "$ENDPOINTS"

          echo "$ENDPOINTS" > endpoints.txt

      - name: Run smoke tests
        env:
          BASE_URL: http://localhost:8081
        run: |
          echo "Running smoke tests..."
          while read -r endpoint; do
            if [ -n "$endpoint" ]; then
              echo "Testing $endpoint"
              curl --fail --silent --show-error "$BASE_URL$endpoint" > /dev/null
            fi
          done < endpoints.txt

          echo "✓ All endpoints passed smoke test"

