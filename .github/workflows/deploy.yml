name: "Stage 1 – Baseline Playback"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-with-mocks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install app dependencies
        run: npm ci

      # ── WireMock CLI setup ───────────────────────────────
      - name: Install WireMock CLI
        run: npm install --global @wiremock/cli

      - name: Authenticate with WireMock Cloud
        run: wiremock config set api_token "${{ secrets.WIREMOCK_API_TOKEN }}"

      # ── Pull SINGLE mock API ─────────────────────────────
      - name: Pull mock API from WireMock Cloud
        run: |
          wiremock pull mock-api k59q9 --into example-mock-api

      # ── Start WireMock local playback ────────────────────
      - name: Start WireMock local playback
        run: |
          wiremock run &
          echo "Waiting for WireMock on 8081..."

          timeout 60 bash -c 'until nc -z localhost 8081; do sleep 1; done'

          echo "✓ Mock server ready on :8081 (example-mock-api)"

      # ── Verify mock is running ───────────────────────────
      - name: Run dynamic WireMock smoke tests
        env:
          EXAMPLE_API_BASE_URL: http://localhost:8081
        run: |
          echo "Fetching all WireMock mappings..."

          MAPPINGS=$(curl -s $EXAMPLE_API_BASE_URL/__admin/mappings)

          echo "$MAPPINGS" > mappings.json

          echo "Extracting endpoints..."

          ENDPOINTS=$(python3 - << 'EOF'
          import json

          with open("mappings.json") as f:
              data = json.load(f)

          urls = []

          for m in data.get("mappings", []):
              req = m.get("request", {})
              url = req.get("url")

              if url:
                  urls.append(url)

          # remove duplicates
          urls = list(set(urls))

          print("\n".join(urls))
          EOF
          )

              echo "Found endpoints:"
              echo "$ENDPOINTS"

              echo ""
              echo "Running smoke tests..."

              for endpoint in $ENDPOINTS; do
                echo "Testing $endpoint"
                curl --fail --silent --show-error \
                  "$EXAMPLE_API_BASE_URL$endpoint" > /dev/null
              done

              echo "✓ All WireMock stubs passed smoke test"   
      # ── Run tests ────────────────────────────────────────
      - name: Run tests against WireMock playback
        env:
          EXAMPLE_API_BASE_URL: http://localhost:8081
          EXAMPLE_API_KEY: mock-key
        run: npm test